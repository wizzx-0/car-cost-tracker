        const tireLifeKm = 20000;


        function calculateCost() {

            const annualKm = Number(
                document.getElementById("km").value
            );

            const fuelPrice = Number(
                document.getElementById("fuel").value
            );

            const selectedCar =
                document.getElementById("car").value;

            const car = cars.find(
                car => car.name === selectedCar
            );

            const fuelCost =
                (annualKm / 100) *
                car.fuel_consumption *
                fuelPrice;

            const tiresCost =
                (annualKm / tireLifeKm) *
                car.tires;

            const annualCost =
                car.insurance +
                car.maintenance +
                fuelCost +
                tiresCost;

            const monthlyCost =
                annualCost / 12;

            document.getElementById("result").innerHTML = `
        <h2>Annual cost</h2>
        <div class="total-cost">
            ${annualCost.toFixed(2)} € / year
        </div>
        <p>
            ≈ ${monthlyCost.toFixed(2)} € / month
        </p>
    `;
