        function fillComparisonSelects() {

            const car1 = document.getElementById("car1");
            const car2 = document.getElementById("car2");

            cars.forEach(car => {

                const option1 = document.createElement("option");
                option1.value = car.name;
                option1.textContent = car.name;

                const option2 = document.createElement("option");
                option2.value = car.name;
                option2.textContent = car.name;

                car1.appendChild(option1);
                car2.appendChild(option2);
            });

            // Deux voitures différentes par défaut
            car2.selectedIndex = 1;
        }
        function compareCars() {

            const selectedCar1 =
                document.getElementById("car1").value;

            const selectedCar2 =
                document.getElementById("car2").value;

            const car1 =
                cars.find(car => car.name === selectedCar1);

            const car2 =
                cars.find(car => car.name === selectedCar2);

            const annualKm =
                Number(document.getElementById("km").value);

            const fuelPrice =
                Number(document.getElementById("fuel").value);

            const fuelCost1 =
                (annualKm / 100) *
                car1.fuel_consumption *
                fuelPrice;

            const tiresCost1 =
                (annualKm / tireLifeKm) *
                car1.tires;

            const total1 =
                car1.insurance +
                car1.maintenance +
                fuelCost1 +
                tiresCost1;


            const fuelCost2 =
                (annualKm / 100) *
                car2.fuel_consumption *
                fuelPrice;

            const tiresCost2 =
                (annualKm / tireLifeKm) *
                car2.tires;

            const total2 =
                car2.insurance +
                car2.maintenance +
                fuelCost2 +
                tiresCost2;


            const difference =
                Math.abs(total1 - total2);


            let cheaperCar;

            if (total1 < total2) {
                cheaperCar = car1.name;
            } else if (total2 < total1) {
                cheaperCar = car2.name;
            } else {
                cheaperCar = "Both cars cost the same";
            }


            document.getElementById("comparison-result").innerHTML = `

        <div class="comparison-card">

            <div class="comparison-column">
                <h3>${car1.name}</h3>

                <p>
                    Annual cost:

                </p>

                <p>
                    Monthly cost:
                    <strong>${(total1 / 12).toFixed(2)} €</strong>
                </p>
            </div>

                <p>

                </p>
            </div>

        </div>

            <p>

                <strong>${cheaperCar}</strong>
            </p>

            <p>
                Difference:
                <strong>${difference.toFixed(2)} € / year</strong>
            </p>

        </div>

    `;

        function updateCarImage() {

            const image =

                image.alt = "Lamborghini Aventador SVJ";

                imageContainer.style.display = "block";

                image.alt = selectedCar;

                imageContainer.style.display = "none";
            }
        }
        document.getElementById("car").addEventListener(
            "change",
            updateCarImage
        );

        function calculateCost() {

            const annualKm = Number(
                document.getElementById("km").value
            );

            const fuelPrice = Number(
                document.getElementById("fuel").value
            );

            const selectedCar =
                document.getElementById("car").value;

            const car = cars.find(
                car => car.name === selectedCar
            );
            document.getElementById("car-image").src = car.image;
            document.getElementById("car-image-container").style.display = "block";
            

            const fuelCost =
                (annualKm / 100) *
                car.fuel_consumption *
                fuelPrice;

            const tiresCost =
                (annualKm / tireLifeKm) *
                car.tires;

            const annualCost =
                car.insurance +
                car.maintenance +
                fuelCost +
                tiresCost;

            const monthlyCost =
                annualCost / 12;

            document.getElementById("result").innerHTML = `
        <h2>Annual cost</h2>
        <div class="total-cost">
            ${annualCost.toFixed(2)} € / year
        </div>
        <p>
            ≈ ${monthlyCost.toFixed(2)} € / month
        </p>
    `;
