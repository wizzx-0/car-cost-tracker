<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Super Car Cost Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Super Car Cost Tracker</h1>

        <div class="input-section">
            <h2>Calculate your annual car costs</h2>

        <div class="inputs-row">

    <div class="input-group">
        <label for="km">Annual kilometers:</label>
        <input type="number" id="km" placeholder="15000">
    </div>

    <div class="input-group">
        <label for="fuel">Fuel price per liter:</label>
        <input type="number" id="fuel" step="0.01" placeholder="1.70">
    </div>

</div>

        <br><br>

        <div class="car-selection">

    <label for="car">Choose your car:</label>

    <select id="car">
        <option>Lamborghini Aventador SVJ</option>
        <option>Porsche 911 992 GT3RS</option>
        <option>Ferrari 812 Superfast</option>
        <option>McLaren 720S</option>
        <option>BMW M4 Competition</option>
    </select>

</div>

            <br><br>
        </div>
        <button onclick="calculateCost()">Calculate</button>

        <p id="result"></p>

        <div id="details"></div>

    </div>


    <script>

        const cars = [
            {
                name: "Lamborghini Aventador SVJ",
                insurance: 5000,
                maintenance: 4000,
                fuel_consumption: 20,
                tires: 3700
            },

            {
                name: "Porsche 911 992 GT3RS",
                insurance: 3500,
                maintenance: 2500,
                fuel_consumption: 13,
                tires: 3400
            },

            {
                name: "Ferrari 812 Superfast",
                insurance: 4000,
                maintenance: 3000,
                fuel_consumption: 16,
                tires: 3000
            },

            {
                name: "McLaren 720S",
                insurance: 3500,
                maintenance: 3000,
                fuel_consumption: 12,
                tires: 2400
            },

            {
                name: "BMW M4 Competition",
                insurance: 2000,
                maintenance: 1000,
                fuel_consumption: 10,
                tires: 2000
            }
        ];


        const tireLifeKm = 20000;


        function calculateCost() {

            const annualKm = Number(
                document.getElementById("km").value
            );

            const fuelPrice = Number(
                document.getElementById("fuel").value
            );

            const selectedCar =
                document.getElementById("car").value;


            const car = cars.find(
                car => car.name === selectedCar
            );


            const fuelCost =
                (annualKm / 100) *
                car.fuel_consumption *
                fuelPrice;


            const tiresCost =
                (annualKm / tireLifeKm) *
                car.tires;


            const annualCost =
                car.insurance +
                car.maintenance +
                fuelCost +
                tiresCost;


            document.getElementById("result").textContent =
                "Annual cost for " +
                car.name +
                ": " +
                annualCost.toFixed(2) +
                " €";


            document.getElementById("details").innerHTML = `

                <h3>Cost details</h3>

                <p>
                    Insurance:
                    ${car.insurance.toFixed(2)} €
                </p>

                <p>
                    Maintenance:
                    ${car.maintenance.toFixed(2)} €
                </p>

                <p>
                    Fuel:
                    ${fuelCost.toFixed(2)} €
                </p>

                <p>
                    Tires:
                    ${tiresCost.toFixed(2)} €
                </p>

            `;
        }

    </script>

</body>

</html>
